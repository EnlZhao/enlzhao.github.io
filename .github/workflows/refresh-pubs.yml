name: Refresh pubs.bib from Google Scholar

# Required repo settings:
# - Settings → Actions → General → Workflow permissions: "Allow GitHub Actions to create and approve pull requests"
# - Settings → General → Pull Requests → "Allow auto-merge"

on:
  schedule:
    # Every Monday at 08:00 UTC — weekly cadence. PR volume is gated by SerpApi diffs,
    # so weekly runs only produce a PR when there is something new to merge.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-pubs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-refresh-pubs-${{ hashFiles('.github/scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-refresh-pubs-

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Run refresh script
        id: refresh
        env:
          SCHOLAR_USER: rPclf40AAAAJ
          PUBS_BIB_PATH: pubs.bib
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GITHUB_OUTPUT: ${{ github.output }}
        run: python .github/scripts/refresh_pubs.py

      - name: Create Pull Request
        if: steps.refresh.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/scholar-refresh
          title: "chore(pubs): refresh from Google Scholar"
          commit-message: "chore(pubs): refresh from Google Scholar"
          body: |
            Auto-generated by the `Refresh pubs.bib from Google Scholar` workflow.

            See the workflow run for the diff rationale. After merge, the homepage (which
            fetches `pubs.bib` at runtime) will reflect the changes automatically.
          delete-branch: true
          auto-merge: true

